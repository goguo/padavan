name: build-zerotier-mipsel-musl
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y build-essential wget xz-utils

      - name: 下载 musl 工具链并定位编译器
        run: |
          wget -q https://github.com/TurBoTse/padavan/releases/download/toolchain/mipsel-linux-musl.tar.xz
          tar -xf mipsel-linux-musl.tar.xz          
          GCCBIN=$(dirname "$(find "$PWD" -name 'mipsel-linux-musl-gcc' -type f | head -1)")
          echo "工具链 bin 目录: $GCCBIN"
          ls "$GCCBIN"
          echo "GCCBIN=$GCCBIN" >> "$GITHUB_ENV"

      - name: 下载 zerotier 1.14.2 源码
        run: |
          wget -q https://github.com/zerotier/ZeroTierOne/archive/refs/tags/1.14.2.tar.gz
          tar -xf 1.14.2.tar.gz

      - name: 交叉编译
        run: |
          export PATH="${{ env.GCCBIN }}:$PATH"
          which mipsel-linux-musl-gcc
          cd ZeroTierOne-1.14.2
          make -j$(nproc) one \
            CC=mipsel-linux-musl-gcc \
            CXX=mipsel-linux-musl-g++ \            
            CXXFLAGS="-O2 -std=c++17 -pthread -Wall -Wno-deprecated -Wno-class-memaccess -Wno-maybe-uninitialized" \
            LDFLAGS="-static -pthread -Wl,-z,noexecstack" \
            LIBS="-latomic"            
          mipsel-linux-musl-strip zerotier-one
          file zerotier-one

      - name: 上传编译好的文件
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-1.14.2-mipsel-static
          path: ZeroTierOne-1.14.2/zerotier-one
